<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Alex's Bouncer</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f6f7; --card: #fff; --text: #1d1d1f; --muted: #6e6e73; --accent: #f96854; --field: #f0f0f2; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111214; --card: #1c1d20; --text: #f2f2f3; --muted: #a1a1a6; --field: #2a2b2f; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 16px; box-sizing: border-box; }
  main { background: var(--card); border-radius: 16px; padding: 32px; width: 100%; max-width: 440px; box-sizing: border-box;
         text-align: center; box-shadow: 0 8px 30px rgb(0 0 0 / .08); border-top: 4px solid var(--accent); }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 16px; }
  p:last-child { margin-bottom: 0; }
  code { display: block; background: var(--field); border-radius: 10px; padding: 12px; margin: 0 0 12px;
         font: 13px/1.4 ui-monospace, Menlo, monospace; word-break: break-all; text-align: left; user-select: all; }
  button { appearance: none; border: 0; border-radius: 10px; background: var(--accent); color: #fff; font: inherit;
           font-weight: 600; padding: 10px 20px; cursor: pointer; min-width: 160px; }
  [hidden] { display: none; }
</style>
</head>
<body>
<main>
  <h1 id="title">Linking Patreon…</h1>
  <p id="message"></p>
  <div id="result" hidden>
    <code id="code"></code>
    <button id="copy" type="button">Copy code</button>
    <p style="margin-top:16px">Go back to Discord, tap <strong>Enter code</strong> and paste it. The code works once and expires in a few minutes.</p>
  </div>
</main>
<script>
  const params = new URLSearchParams(location.search);
  const code = params.get("code");
  const state = params.get("state");
  const title = document.getElementById("title");
  const message = document.getElementById("message");

  // Keep the code out of the browser history.
  history.replaceState(null, "", location.pathname);

  if (params.get("error")) {
    title.textContent = "Linking cancelled";
    message.textContent = "No worries. Run /patreon link in Discord whenever you want to try again.";
  } else if (!code || !state) {
    title.textContent = "Nothing to link";
    message.textContent = "Run /patreon link in Discord and use the Connect Patreon button there.";
  } else {
    const value = `${state}~${code}`;
    title.textContent = "Almost done";
    message.textContent = "Copy this code:";
    document.getElementById("code").textContent = value;
    document.getElementById("result").hidden = false;
    const button = document.getElementById("copy");
    button.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(value);
        button.textContent = "Copied ✓";
      } catch {
        button.textContent = "Select the code and copy it";
      }
    });
  }
</script>
</body>
</html>
